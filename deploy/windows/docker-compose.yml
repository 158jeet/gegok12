services:
  app:
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
    env_file: ../../.env.school
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
  web:
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
      target: web
    depends_on: [app]
    ports: ['8080:80']
    volumes:
      - ../../deploy/windows/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
  worker:
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
    env_file: ../../.env.school
    command: ['php','artisan','queue:work','--sleep=2','--tries=2','--timeout=120']
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tagore_erp
      MYSQL_USER: tagore
      MYSQL_PASSWORD: TagoreDbPilot2026!
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.build}
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      # Keep health results clean and allow slow Windows/HDD crash recovery.
      test: ['CMD-SHELL','MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m
  redis:
    image: redis:7-alpine
volumes:
  db_data:
  app_storage: