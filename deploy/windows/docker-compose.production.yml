services:
  app:
    image: tagore-erp-app:production
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
      target: app
    env_file: ../../.env.school
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
  web:
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
      target: web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../deploy/windows/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
      - ../../deploy/windows/letsencrypt:/etc/letsencrypt:ro
      - ../../deploy/windows/acme-challenge:/var/www/acme:ro
  worker:
    image: tagore-erp-app:production
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
      target: app
    env_file: ../../.env.school
    restart: unless-stopped
    command: ["php","artisan","queue:work","--sleep=2","--tries=2","--timeout=120"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tagore_erp
      MYSQL_USER: tagore
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.school}
      MYSQL_ROOT_PASSWORD: ${TAGORE_DB_ROOT_PASSWORD:?Set TAGORE_DB_ROOT_PASSWORD in .env.school}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  db_data:
  app_storage:
