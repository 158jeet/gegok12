services:
  app:
    image: tagore-erp-app:production
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
      target: app
    env_file: ../../.env.school
    restart: unless-stopped
    command: ["sh", "-lc", "mkdir -p /var/www/html/storage/app /var/www/html/storage/framework/cache/data /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/storage/logs /var/www/html/bootstrap/cache && chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R ug+rwx /var/www/html/storage /var/www/html/bootstrap/cache && exec php-fpm"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
  web:
    image: tagore-erp-web:production
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
      target: web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../deploy/windows/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
      - type: bind
        source: ${TAGORE_NGINX_CERTS_PATH:-G:/TagoreSecrets/nginx-certs}
        target: /etc/nginx/certs
        read_only: true
      - ../../deploy/windows/acme-challenge:/var/www/acme:ro
  worker:
    image: tagore-erp-app:production
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
      target: app
    env_file: ../../.env.school
    restart: unless-stopped
    command: ["sh", "-lc", "mkdir -p /var/www/html/storage/app /var/www/html/storage/framework/cache/data /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/storage/logs /var/www/html/bootstrap/cache && chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R ug+rwx /var/www/html/storage /var/www/html/bootstrap/cache && exec php artisan queue:work --sleep=2 --tries=2 --timeout=120"]
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tagore_erp
      MYSQL_USER: tagore
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.school}
      MYSQL_ROOT_PASSWORD: ${TAGORE_DB_ROOT_PASSWORD:?Set TAGORE_DB_ROOT_PASSWORD in .env.school}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Avoid mysqladmin's insecure-password CLI warning and allow slow Windows/HDD recovery.
      # MYSQL_PWD is scoped to this health-check process; it is not written to logs or argv.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  db_data:
  app_storage:
