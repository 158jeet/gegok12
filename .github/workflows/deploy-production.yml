name: Tagore Production Deploy (backup-first, Windows self-hosted)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tagore-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup, deploy and verify production on the school server
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Preserve existing server checkout changes before deployment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\server\gegok12-main-new'
          if (-not (Test-Path (Join-Path $root '.git'))) { throw "Expected production checkout not found: $root" }
          # Enumerate individual paths instead of recursively copying untracked directories.
          # Generated build/cache trees can change while other CI jobs use this machine.
          $status = @(git -c "safe.directory=$root" -C $root status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect production checkout before backup.' }
          $preserve = @()
          foreach ($entry in $status) {
            if ($entry.Length -lt 4) { continue }
            $relative = $entry.Substring(3).Trim()
            if ($relative -match ' -> ') { $relative = ($relative -split ' -> ')[-1] }
            $normalized = $relative.Replace('\','/')
            if ($normalized -match '(^|/)(build|node_modules|vendor|dist|coverage|\.gradle|\.idea|\.dart_tool|\.next|\.turbo)(/|$)') { continue }
            if ($normalized -match '(^|/)(\.DS_Store|Thumbs\.db)$') { continue }
            $source = Join-Path $root $relative
            if (Test-Path -LiteralPath $source -PathType Leaf) { $preserve += $relative }
          }
          if ($preserve.Count -eq 0) {
            Write-Host 'No non-generated modified or untracked source files require an archive.'
            exit 0
          }
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $backupRoot = 'G:\TagoreBackups'
          New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "tagore-checkout-state-$stamp"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($relative in $preserve) {
            $source = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { continue }
            $destination = Join-Path $stage $relative
            $parent = Split-Path -Parent $destination
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $source -Destination $destination -Force
          }
          $archive = Join-Path $backupRoot "predeploy-checkout-state-$stamp.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $archive) -or (Get-Item -LiteralPath $archive).Length -lt 100) {
            throw 'Existing server source changes could not be backed up; deployment is blocked.'
          }
          $verify = Join-Path $env:RUNNER_TEMP "tagore-checkout-state-verify-$stamp"
          Expand-Archive -LiteralPath $archive -DestinationPath $verify -Force
          $restoredFiles = @(Get-ChildItem -LiteralPath $verify -Recurse -File)
          if ($restoredFiles.Count -ne $preserve.Count) { throw "Source backup verification mismatch: expected $($preserve.Count), restored $($restoredFiles.Count)." }
          Write-Host "Verified source-state backup: $archive ($($restoredFiles.Count) files)"
          "SOURCE_BACKUP=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify server checkout and deployment prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\server\gegok12-main-new'
          if (-not (Test-Path (Join-Path $root '.git'))) { throw "Expected production checkout not found: $root" }
          if (-not (Test-Path (Join-Path $root '.env.school'))) { throw 'Production .env.school is missing.' }
          if (-not (Test-Path 'G:\TagoreSecrets\nginx-certs\59.90.66.12\fullchain.pem')) { throw 'Production TLS certificate export is missing.' }
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) { throw 'Docker CLI is unavailable.' }
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Compose is unavailable.' }
          $status = git -c "safe.directory=$root" -C $root status --porcelain
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect production checkout.' }
          if ($status) { Write-Host 'Existing checkout changes were archived and verified; deployment may proceed.' }
          "Production checkout and prerequisites verified."

      - name: Create and verify pre-deployment database and uploads backups
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\server\gegok12-main-new'
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $backup = "G:\TagoreBackups\predeploy-$stamp"
          New-Item -ItemType Directory -Force -Path $backup | Out-Null
          Push-Location $root
          try {
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T db sh -lc 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -uroot --single-transaction --routines --triggers --events --no-tablespaces tagore_erp > /tmp/tagore-predeploy.sql'
            if ($LASTEXITCODE -ne 0) { throw 'MySQL dump command failed.' }
            docker cp windows-db-1:/tmp/tagore-predeploy.sql "$backup\tagore_erp.sql"
            if ($LASTEXITCODE -ne 0) { throw 'Could not copy database backup from container.' }
            docker exec windows-db-1 rm -f /tmp/tagore-predeploy.sql
            if ((Get-Item "$backup\tagore_erp.sql").Length -lt 1024) { throw 'Database dump is unexpectedly small; refusing deployment.' }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app tar -czf /tmp/tagore-storage-predeploy.tar.gz -C /var/www/html/storage .
            if ($LASTEXITCODE -ne 0) { throw 'Application storage archive failed.' }
            docker cp windows-app-1:/tmp/tagore-storage-predeploy.tar.gz "$backup\app-storage.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw 'Could not copy application storage backup from container.' }
            docker exec windows-app-1 rm -f /tmp/tagore-storage-predeploy.tar.gz
            if ((Get-Item "$backup\app-storage.tar.gz").Length -lt 100) { throw 'Application storage backup is unexpectedly small.' }
            tar.exe -tzf "$backup\app-storage.tar.gz" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Application storage backup archive failed validation.' }
            Get-FileHash "$backup\tagore_erp.sql","$backup\app-storage.tar.gz" -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content "$backup\SHA256.txt"
            "BACKUP_VERIFIED=$backup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Verified pre-deployment backup: $backup"
          } finally { Pop-Location }

      - name: Update production checkout to the tested main commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\server\gegok12-main-new'
          git -c "safe.directory=$root" -C $root fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Git fetch failed.' }
          git -c "safe.directory=$root" -C $root reset --hard $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not update production checkout to the tested commit.' }
          git -c "safe.directory=$root" -C $root clean -fd
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'deploy\windows\acme-challenge') | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove archived untracked source files from the production checkout.' }
          git -c "safe.directory=$root" -C $root submodule update --init --recursive --force
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize production submodules.' }
          $actual = (git -c "safe.directory=$root" -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch: $actual" }

      - name: Build production images and apply database migrations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\server\gegok12-main-new'
          Push-Location $root
          try {
            # Keep MySQL/Redis and their named volumes untouched; update only app/worker/web.
            $runningServices = docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml ps --services --filter status=running
            foreach ($requiredService in @('db','redis','app')) {
              if ($runningServices -notcontains $requiredService) { throw "Required stateful service $requiredService is not running; refusing deployment." }
            }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml build app web
            if ($LASTEXITCODE -ne 0) { throw 'Production image build failed.' }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml run --rm --no-deps app php artisan migrate --force
            if ($LASTEXITCODE -ne 0) { throw 'Database migration failed. Preserve the verified backup for recovery.' }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml run --rm --no-deps app php artisan optimize:clear
            if ($LASTEXITCODE -ne 0) { throw 'Laravel cache clear failed.' }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml up -d --no-deps app worker web
            if ($LASTEXITCODE -ne 0) { throw 'Production services failed to start.' }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan config:cache
            if ($LASTEXITCODE -ne 0) { throw 'Config cache failed.' }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan route:cache
            if ($LASTEXITCODE -ne 0) { throw 'Route cache failed.' }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan view:cache
            if ($LASTEXITCODE -ne 0) { throw 'View cache failed.' }
          } finally { Pop-Location }

      - name: Run production health and web smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\server\gegok12-main-new'
          Push-Location $root
          try {
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml ps
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect production services.' }
            $running = docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml ps --services --filter status=running
            foreach ($svc in @('app','web','worker','db','redis')) {
              if ($running -notcontains $svc) { throw "Required service $svc is not running." }
            }
            docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan about
            if ($LASTEXITCODE -ne 0) { throw 'Laravel health check failed.' }
            $status = & curl.exe -k -sS -o NUL -w "%{http_code}" --connect-timeout 10 --max-time 30 https://127.0.0.1/login
            if ($LASTEXITCODE -ne 0 -or $status -ne '200') { throw "Local HTTPS login smoke test failed: HTTP $status" }
            Write-Host 'Production deployment smoke tests passed.'
          } finally { Pop-Location }
  public-smoke:
    name: Verify public ERP and school websites from the internet
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          login_html="$(curl --insecure --location --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 30 "https://59.90.66.12/login")"
          if ! grep -q "Sign in to Tagore ERP" <<<"$login_html" || grep -qi "Parent ERP Login" <<<"$login_html"; then
            echo "::error title=Login branding mismatch::Expected generic Tagore ERP login wording."
            exit 1
          fi
          echo "Generic Tagore ERP login branding verified."
          urls=(
            "https://59.90.66.12/tps/"
            "https://59.90.66.12/tps/about"
            "https://59.90.66.12/tps/admissions"
            "https://59.90.66.12/tps/admissions/faq"
            "https://59.90.66.12/tps/admissions/funnel"
            "https://59.90.66.12/tps/admissions/parent-checklist"
            "https://59.90.66.12/tps/admissions/pathways"
            "https://59.90.66.12/tps/hostel/guide"
            "https://59.90.66.12/tps/parent-guide"
            "https://59.90.66.12/tps/start"
            "https://59.90.66.12/tps/visit"
            "https://59.90.66.12/tps/visit/guide"
            "https://59.90.66.12/tps/admissions/pathways/early-years"
            "https://59.90.66.12/tps/admissions/pathways/primary"
            "https://59.90.66.12/tps/admissions/pathways/middle"
            "https://59.90.66.12/tps/admissions/pathways/secondary"
            "https://59.90.66.12/tps/admissions/pathways/senior-secondary"
            "https://59.90.66.12/tier/"
            "https://59.90.66.12/tier/about"
            "https://59.90.66.12/tier/choose"
            "https://59.90.66.12/tier/connect"
            "https://59.90.66.12/tier/contact"
            "https://59.90.66.12/tier/help"
            "https://59.90.66.12/tier/institutions"
            "https://59.90.66.12/tier/partnerships"
            "https://59.90.66.12/tier/start"
            "https://59.90.66.12/tier/institutions/tagore-bal-niketan"
            "https://59.90.66.12/tier/institutions/tagore-smart-school"
            "https://59.90.66.12/tier/institutions/tagore-vedant-academy"
            "https://59.90.66.12/tier/institutions/tagore-pg-college"
            "https://59.90.66.12/tier/institutions/tagore-hostel"
          )
          for url in "${urls[@]}"; do
            status="$(curl --insecure --location --silent --show-error --output /dev/null --write-out "%{http_code}" --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 30 "$url")"
            if [[ "$status" != "200" ]]; then
              echo "::error title=Public smoke test failed::$url returned HTTP $status"
              exit 1
            fi
            echo "$url -> HTTP $status"
          done
