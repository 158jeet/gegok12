name: TagoreK12 Android Clients

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-clients.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [parent, teacher]

    steps:
      - name: Checkout ERP and pinned mobile sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Tagore Android client
        env:
          TAGORE_API_BASE_URL: ${{ vars.TAGORE_API_BASE_URL }}
        run: bash scripts/mobile/prepare-tagore-android.sh

      - name: Build and run unit tests
        run: |
          cd "$GITHUB_WORKSPACE/mobile/${{ matrix.app }}"
          test -f settings.gradle
          test -f app/build.gradle
          # These upstream app repos do not commit the Gradle wrapper script.
          gradle --version
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Run Android emulator instrumentation and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -eu
            cd "$GITHUB_WORKSPACE/mobile/${{ matrix.app }}"
            APK="$(find app/build/outputs/apk -type f -name '*.apk' ! -name '*androidTest*' | head -n 1)"
            if [ -z "$APK" ]; then
              echo "No installable debug APK found under app/build/outputs/apk"
              find app/build/outputs/apk -maxdepth 5 -type f -print || true
              exit 1
            fi
            echo "Using APK: $APK"
            adb wait-for-device
            for i in $(seq 1 90); do
              BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$BOOTED" = "1" ]; then break; fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            gradle connectedDebugAndroidTest --stacktrace --no-daemon
            adb install -r "$APK"
            if [ "${{ matrix.app }}" = "parent" ]; then
              PACKAGE="com.tagoregroup.parent"
            else
              PACKAGE="com.tagoregroup.teacher"
            fi
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8
            if ! adb shell pidof "$PACKAGE" >/dev/null; then
              echo "App process did not remain running: $PACKAGE"
              adb logcat -d -t 2500 > "$GITHUB_WORKSPACE/android-${{ matrix.app }}-logcat.txt" || true
              exit 1
            fi
            echo "Emulator launch smoke test passed: $PACKAGE"

      - name: Upload APK and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tagorek12-${{ matrix.app }}-android-ci
          path: |
            mobile/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
            android-${{ matrix.app }}-logcat.txt
          if-no-files-found: warn
          retention-days: 30
