name: TagoreK12 Android Clients
# CI validates both pinned Android clients. Package cleanup is performed before Gradle.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-clients.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-clients.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [parent, teacher]

    steps:
      - name: Checkout ERP and pinned mobile sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Tagore Android client
        env:
          TAGORE_API_BASE_URL: ${{ vars.TAGORE_API_BASE_URL }}
        run: bash scripts/mobile/prepare-tagore-android.sh

      - name: Build and test Android client
        run: |
          cd mobile/${{ matrix.app }}
          gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tagorek12-${{ matrix.app }}-debug
          path: mobile/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
