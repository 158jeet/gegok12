name: TagoreK12 Prototype

on:
  push:
    branches: [main, 'tagore/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer
        run: composer validate --no-check-publish
      - name: PHP syntax check (Tagore layer)
        run: |
          find app/Http/Controllers/Tagore app/Models/Tagore app/Services/Tagore database/seeders -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: php artisan test --filter=TagorePrototypeTest
