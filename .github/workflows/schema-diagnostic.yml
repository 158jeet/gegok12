name: Temporary schema diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate transport schema definitions
        run: |
          echo "=== tagore_transport_routes definitions ==="
          grep -RIn "tagore_transport_routes" database/migrations || true
          echo "=== all transport table definitions ==="
          grep -RIn "tagore_transport_" database/migrations || true
          echo "=== controller authorize definitions ==="
          grep -RInE "(private|protected)[[:space:]]+function[[:space:]]+authorize[[:space:]]*\\(" app/Http/Controllers || true
          echo "=== missing exam controller references ==="
          grep -RIn "AddonInstallExamController" routes app config || true
