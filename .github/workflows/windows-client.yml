name: TagoreK12 Windows Client

on:
  pull_request:
  push:
    branches:
      - main
      - feature/offline-clients

jobs:
  windows-client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TagoreK12-Windows
          path: desktop/dist/*.exe
