name: ERP CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/ci.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, intl
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-interaction
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: |
          find app routes database config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare persistent SQLite database
        run: touch database/ci.sqlite
      - name: Generate testing application key
        run: php artisan key:generate --force --no-interaction
      - name: Bootstrap migrations
        run: php artisan migrate --force --no-interaction
      - name: Seed testing database
        run: php artisan db:seed --force --no-interaction
      - name: Bootstrap routes
        run: |
          set +e
          php artisan route:list -vvv > /tmp/tagore-routes.txt 2>&1
          code=$?
          cat /tmp/tagore-routes.txt
          echo "route:list exit code: $code"
          exit $code
      - name: Run Laravel tests
        run: php artisan test


  production-docker-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: tagore-ci-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create production test environment
        run: |
          cat > .env.school <<'EOF'
          APP_NAME="Tagore ERP"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://127.0.0.1
          TIMEZONE=Asia/Kolkata
          DB_CONNECTION=mysql
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=tagore_erp
          DB_USERNAME=tagore
          DB_PASSWORD=TagoreTest@2026
          TAGORE_DB_ROOT_PASSWORD=TagoreRoot@2026
          QUEUE_CONNECTION=database
          CACHE_STORE=file
          SESSION_DRIVER=file
          SESSION_SECURE_COOKIE=false
          LOG_CHANNEL=stderr
          FILESYSTEM_DISK=local
          MAIL_MAILER=array
          REDIS_HOST=redis
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          EOF
      - name: Build production images
        run: docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml build
      - name: Prepare temporary TLS certificate for Nginx smoke test
        run: |
          mkdir -p deploy/windows/letsencrypt/live/59.90.66.12 deploy/windows/acme-challenge
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \\
            -keyout deploy/windows/letsencrypt/live/59.90.66.12/privkey.pem \\
            -out deploy/windows/letsencrypt/live/59.90.66.12/fullchain.pem \\
            -subj "/CN=59.90.66.12"
      - name: Start production services
        run: docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml up -d db redis app worker web
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T db mysqladmin ping -h localhost -u root -p'TagoreRoot@2026' --silent; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml logs db
          exit 1
      - name: Verify Laravel bootstrap and persistent storage
        run: |
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app sh -lc 'test -d /var/www/html/storage/framework/views && test -d /var/www/html/storage/framework/cache && test -d /var/www/html/bootstrap/cache'
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan key:generate --force --no-interaction
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan migrate --force --no-interaction
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan optimize:clear --no-interaction
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan config:cache --no-interaction
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan route:cache --no-interaction
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T app php artisan view:cache --no-interaction
          docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml exec -T web nginx -t
          curl --fail --silent --show-error --insecure --resolve 59.90.66.12:443:127.0.0.1 https://59.90.66.12/ -o /tmp/tagore-home.html
          grep -q "Tagore" /tmp/tagore-home.html
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.school -f deploy/windows/docker-compose.production.yml down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
