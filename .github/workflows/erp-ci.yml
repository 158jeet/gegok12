name: ERP CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/ci.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TAGORE_OLYMPIAD_INTAKE_ENABLED: true
      TAGORE_OLYMPIAD_INSTITUTION_ID: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inventory authentication and OTP call sites
        run: |
          set -o pipefail
          grep -R -n -E --include='*.php' 'createAuthentication[[:space:]]*\\(|checkAuthentication[[:space:]]*\\(|Authentication::|new Authentication|authentications|logoutDevices[[:space:]]*\\(' app routes tests | tee /tmp/tagore-auth-call-sites.txt
          test -s /tmp/tagore-auth-call-sites.txt
          {
            echo "## Authentication and OTP call-site inventory"
            echo
            echo 'The following matches were collected from the exact CI checkout:'
            echo
            echo '~~~text'
            cat /tmp/tagore-auth-call-sites.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, intl
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-interaction
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: |
          find app routes database config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare persistent SQLite database
        run: touch database/ci.sqlite
      - name: Generate testing application key
        run: php artisan key:generate --force --no-interaction
      - name: Bootstrap migrations
        run: php artisan migrate --force --no-interaction
      - name: Seed testing database
        run: php artisan db:seed --force --no-interaction
      - name: Bootstrap routes
        run: |
          set +e
          php artisan route:list -vvv > /tmp/tagore-routes.txt 2>&1
          code=$?
          cat /tmp/tagore-routes.txt
          echo "route:list exit code: $code"
          exit $code
      - name: Run Laravel tests
        run: php artisan test



  browser-e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/e2e.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      APP_URL: http://127.0.0.1:8000
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TAGORE_E2E_ENABLED: true
      TAGORE_OLYMPIAD_INTAKE_ENABLED: true
      TAGORE_OLYMPIAD_INSTITUTION_ID: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, intl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare disposable E2E database
        run: touch database/e2e.sqlite
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build application assets for Blade rendering
        run: |
          npm ci
          npm run build
      - name: Install browser E2E dependencies
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare Laravel runtime directories
        run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
      - name: Verify tracked dashboard logo survives frontend build
        run: test -f public/images/logo.png
      - name: Start disposable Laravel server and verify logo asset
        run: |
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/tagore-e2e-server.log 2>&1 &
          echo $! > /tmp/tagore-e2e-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/login >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/images/logo.png >/dev/null
      - name: Run mutating administrator acceptance against disposable CI database
        run: php artisan test --filter=AdministratorAcceptance
      - name: Run human-style authenticated E2E
        run: node tests/e2e/run-authenticated.js
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: tests/e2e/results
          if-no-files-found: ignore
