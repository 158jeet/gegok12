name: ERP CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, intl
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-interaction
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: |
          find app routes database config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bootstrap migrations
        run: php artisan migrate --force --no-interaction
      - name: Bootstrap routes
        run: php artisan route:list --json > /tmp/tagore-routes.json
      - name: Run Laravel tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
