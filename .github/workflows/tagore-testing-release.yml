name: Tagore ERP Testing Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [parent, teacher]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for ERP CI release gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            run_json=$(gh run list --workflow "ERP CI" --branch main --limit 10 --json databaseId,headSha,status,conclusion)
            current=$(echo "$run_json" | jq -r --arg sha "$GITHUB_SHA" '.[] | select(.headSha == $sha) | @base64' | head -n1 || true)
            if [ -n "$current" ]; then
              run=$(echo "$current" | base64 --decode)
              status=$(echo "$run" | jq -r '.status')
              conclusion=$(echo "$run" | jq -r '.conclusion')
              echo "ERP CI status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ]
                exit $?
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for ERP CI for $GITHUB_SHA"
          exit 1
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android client
        env:
          TAGORE_API_BASE_URL: ''
        run: bash scripts/mobile/prepare-tagore-android.sh
      - name: Build APK
        working-directory: mobile/${{ matrix.app }}
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: mobile/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Windows installer
        working-directory: desktop
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp release-files/android-parent/*.apk assets/Tagore-ERP-Parent-Test.apk
          cp release-files/android-teacher/*.apk assets/Tagore-ERP-Teacher-Test.apk
          find release-files/windows-installer -type f -name '*.exe' -print -quit | xargs -I{} cp "{}" assets/Tagore-ERP-Windows-Installer.exe
          find release-files/windows-installer -type f -name '*.msi' -print -quit | xargs -I{} cp "{}" assets/Tagore-ERP-Windows-Installer.msi
          ls -lah assets
      - name: Create testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tagore-testing-v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create tagore-testing-v1.0.0 assets/* \
            --title "Tagore ERP — Testing Package v1.0.0" \
            --notes "Testing package for the Tagore ERP pilot. Includes Parent Android APK, Teacher Android APK, and Windows desktop installers. These are testing builds; provider integrations and production signing are not enabled."

# Keep this workflow on the main branch so release publishing is triggered by merge pushes.
