name: Tagore Windows Pilot Package
on:
  pull_request:
    paths:
      - 'deploy/windows/**'
      - 'database/seeders/TagoreDemoAccountsSeeder.php'
      - 'database/seeders/DatabaseSeeder.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'deploy/windows/**'
      - 'database/seeders/TagoreDemoAccountsSeeder.php'
      - 'database/seeders/DatabaseSeeder.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Prepare pilot env
        run: cp deploy/windows/.env.school.example .env.school
      - name: Validate compose
        run: docker compose -f deploy/windows/docker-compose.yml config
      - name: Build pilot images
        run: docker compose --env-file .env.school -f deploy/windows/docker-compose.yml build
      - name: Verify pilot web image contains Laravel public files
        run: |
          docker compose --env-file .env.school -f deploy/windows/docker-compose.yml run --rm web sh -lc 'test -f /var/www/html/public/index.php && test -f /var/www/html/public/tagore-erp.css'
