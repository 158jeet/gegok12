name: Tagore Windows Pilot Package
on:
  pull_request:
    paths:
      - 'deploy/windows/**'
      - 'database/seeders/TagoreDemoAccountsSeeder.php'
      - 'database/seeders/DatabaseSeeder.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'deploy/windows/**'
      - 'database/seeders/TagoreDemoAccountsSeeder.php'
      - 'database/seeders/DatabaseSeeder.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        run: docker compose -f deploy/windows/docker-compose.yml config
      - name: Build pilot image
        run: docker build -f deploy/windows/Dockerfile -t tagore-pilot:test .
